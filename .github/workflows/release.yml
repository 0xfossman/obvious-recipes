name: Prepare release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build.py
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/obvious-recipes-26.3.zip
            dist/SHA256SUMS
            CHANGELOG.md
      # A Modrinth upload can be enabled later with MODRINTH_TOKEN. No token is stored here.
